<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo y logo de la pagina -->
    <title>Carrito | Gula Pura</title>
    <link rel="icon" href="img/logo-icon/icon_gula_pura.png">
    <!-- link a ccs de bootstrap y estilos propios -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <!-- link a js -->
    <script src="js/carrito.js" defer></script>
</head>

<body class="carrito-page">
    <!--Menu de navegacion-->
    <header class="navbar navbar-carrito">
        <div class="navbar-container">
            <a class="logo" href="index.html" aria-label="Gula Pura, ir al inicio">
                <span class="gulapura-text">GULA PURA</span>
            </a>
            <h1 class="titulo-navegacion">Carrito</h1>
        </div>
    </header>
    <!-- Contenido principal -->
    <main>
        <section id="carrito-vacio" class="estado-vacio" aria-labelledby="titulo-vacio">
            <svg class="icono-carrito" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 8h6l7 32h27M14 16h35l-3 15H17" />
                <circle cx="21" cy="48" r="1.8" fill="currentColor" />
                <circle cx="43" cy="48" r="1.8" fill="currentColor" />
            </svg>
            <h2 id="titulo-vacio">¡Tu carrito está vacío!</h2>
            <p>Ingresa a nuestra carta y agrega los<br>productos que desees a tu pedido</p>
            <button class="boton-principal" type="button" data-abrir-productos>Agregar productos</button>
        </section>
        <!-- Santiago pegame aqui-->
    </main>
</body>

</html>
